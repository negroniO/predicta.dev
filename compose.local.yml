services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: predicta_local
      POSTGRES_PASSWORD: local_preview_only
      POSTGRES_DB: predicta_local
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicta_local -d predicta_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
