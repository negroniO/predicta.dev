services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: predicta_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: predicta_test
    ports:
      - "127.0.0.1:55440:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicta_test -d predicta_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
